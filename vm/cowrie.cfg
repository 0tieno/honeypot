# Cloud Bait overrides. Anything not set here falls back to cowrie.cfg.dist.
[honeypot]
hostname = kd-api-prod01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog_path = var/lib/cowrie/tty
# Short session idle limits keep bot sessions from piling up.
interactive_timeout = 180
authentication_timeout = 120

[shell]
kernel_version = 5.10.0-28-amd64
kernel_build_string = #1 SMP Debian 5.10.209-2 (2024-01-31)
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.4p1 Debian-5+deb11u3

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
